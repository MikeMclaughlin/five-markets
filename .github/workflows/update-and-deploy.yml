name: Update data and deploy Pages

on:
  schedule:
    # Every 30 minutes, Mon–Fri, roughly 8:00 AM – 6:30 PM ET (13:00–23:30 UTC)
    - cron: "*/30 13-23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data
        run: python scripts/fetch_markets.py

      - name: Commit data/markets.json
        run: |
          if git diff --quiet -- data/markets.json; then
            echo "No data change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/markets.json
            git commit -m "data: update markets.json [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - uses: actions/configure-pages@v5

      - name: Build site folder
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/markets.json _site/data/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
